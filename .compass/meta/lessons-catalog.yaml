    status: active
    category: process
    area: methodology
    tags: [specs, evidence, provenance, census, traceability]
    score: 6
    summary: "When a spec cites a triggering observation, record its source (project, session, machine) at spec time; unpinned data become unfindable"
  - file: "LESSON-revert-to-prove-a-regression-test.md"
    status: active
    category: process
    area: testing
    tags: [testing, regression-tests, revert-check, bug-reports, empirical]
    score: 6
    summary: "A test or fix that passes without discriminating the change under test is unwritten; prove it by revert or red run"
  - file: "LESSON-untestable-criterion-is-a-spec-defect.md"
    status: active
    category: process
    area: testing
    tags: [testing, pre-build-station, acceptance-criteria, spec-defect, oracle]
    score: 6
    summary: "A criterion that defines no input class cannot be tested; report the spec defect, never invent the equivalence class"
  - file: "LESSON-wikilink-validator-skip-code.md"
    status: active
    category: process
    area: workflow
    tags: [validation, content-aware, parsing, self-reference, edit-anchors]
    score: 6
    summary: "Match use, not mention - matchers and edit anchors alike: bind to grammar position, never a substring prose repeats"
  - file: "LESSON-autocrlf-churns-lf-writers.md"
    status: active
    category: process
    area: workflow
    tags: [git, autocrlf, line-endings, gitattributes, churn, hooks]
    score: 5
    summary: "With core.autocrlf=true and no .gitattributes, git checks files out as CRLF; a tool that writes LF rewrites them every run, causing perpetual diffs"
  - file: "LESSON-blind-the-author-in-self-validation.md"
    status: active
    category: process
    area: methodology
    tags: [experiments, blinding, validation, measurement, empirical]
    score: 5
    summary: "Blinding fails through the answer key and the vault's own hot path, not only shared roles; verify the rater is blind"
  - file: "LESSON-dont-strip-agent-quality-stations.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, briefs, code-review, agent-protocol, orchestration]
    score: 5
    summary: "A blanket no-sub-agents ban in a spawn brief strips the builder's review station; twice violated, both violations caught real bugs"
  - file: "LESSON-headless-worker-denies-tools-silently.md"
    status: active
    category: process
    area: workflow
    tags: [headless, permissions, tool-scoping, background-worker, silent-failure]
    score: 5
    summary: "Headless claude -p runs deny Write/Bash by default; scope the worker's tools exactly, don't bypass"
  - file: "LESSON-hook-cli-gate-stdin-on-flag.md"
