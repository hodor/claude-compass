lessons:
  - file: "LESSON-adversarial-plan-review-before-build.md"
    status: active
    category: process
    area: methodology
    tags: [review, plans, specs, adversarial, multi-lens, measurement]
    score: 9
    summary: "Review specs/plans with 3 adversarial lenses before approval, and have reviewers measure against the real corpus, not opine"
  - file: "LESSON-append-only-index-misses-mutations.md"
    status: active
    category: process
    area: methodology
    tags: [derived-index, sync, append-only, staleness, catalog]
    score: 6
    summary: "Derived-index repair must be active, and every prune gated on provable coverage, or self-healing self-destroys."
  - file: "LESSON-long-agents-stall-resume-them.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, orchestration, stall, resume, turn-limits, monitoring]
    score: 6
    summary: "A subagent completion notice whose final text reads like mid-task narration is a stall, not a result; resume it with 'continue from exactly where you stopped' instead of respawning"
  - file: "LESSON-pin-the-motivating-datum.md"
    status: active
    category: process
    area: methodology
    tags: [specs, evidence, provenance, census, traceability]
    score: 6
    summary: "When a spec cites a triggering observation, record its source (project, session, machine) at spec time; unpinned data become unfindable"
  - file: "LESSON-revert-to-prove-a-regression-test.md"
    status: active
    category: process
    area: testing
    tags: [testing, regression-tests, revert-check, bug-reports, empirical]
    score: 6
    summary: "A test or fix that passes without discriminating the change under test is unwritten; prove it by revert or red run"
  - file: "LESSON-untestable-criterion-is-a-spec-defect.md"
    status: active
    category: process
    area: testing
    tags: [testing, pre-build-station, acceptance-criteria, spec-defect, oracle]
    score: 6
    summary: "A criterion that defines no input class cannot be tested; report the spec defect, never invent the equivalence class"
  - file: "LESSON-wikilink-validator-skip-code.md"
    status: active
    category: process
    area: workflow
    tags: [validation, content-aware, parsing, self-reference, edit-anchors]
    score: 6
    summary: "Match use, not mention - matchers and edit anchors alike: bind to grammar position, never a substring prose repeats"
  - file: "LESSON-blind-the-author-in-self-validation.md"
    status: active
    category: process
    area: methodology
    tags: [experiments, blinding, validation, measurement, empirical]
    score: 5
    summary: "Blinding fails through the answer key and the vault's own hot path, not only shared roles; verify the rater is blind"
  - file: "LESSON-hook-if-clause-no-or.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, if-clause, permission-rules, plugin-config]
    score: 5
    summary: "Settings-file hooks support an `if` clause (verified on 2.1.330); `||` inside it is untested, use a pipe matcher"
  - file: "LESSON-hook-payloads-observe-before-coding.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, payloads, parsing, tool-output, evidence]
    score: 6
    summary: "Observe the real emission or code path first; assumed shapes and reported causes ship dead work under a green suite"
  - file: "LESSON-hooks-load-only-from-settings.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, settings, install-drift, registration, claude-code]
    score: 5
    summary: "Hooks load only from settings-file hooks keys or registered plugins; a bare .claude/hooks/hooks.json never fires"
  - file: "LESSON-human-practice-rationing-assumes-human-scarcity.md"
    status: active
    category: process
    area: methodology
    tags: [research-synthesis, human-practice, agent-methodology, rationing, literature-import]
    score: 7
    summary: "Name the precondition a borrowed mechanism needs before importing it; mark every finding maps or metaphor"
  - file: "LESSON-scratch-vaults-need-compass-dir.md"
    status: active
    category: process
    area: workflow
    tags: [cli, vault-root, isolation, probes, hooks, env-var]
    score: 6
    summary: "CLAUDE_PROJECT_DIR redirects the compass CLI only when it contains .compass; otherwise cwd-walk silently targets the enclosing vault"
  - file: "LESSON-sizing-unrecorded-blind-to-born-folder.md"
    status: active
    category: domain
    area: methodology
    tags: [sizing, validate, reconciliation, born-folder]
    score: 5
    summary: "SPEC-016 D-06's folder shape breaks file-stem==spec-name assumptions: sizing check, doctor suggested-name"
  - file: "LESSON-subagent-worktrees-fork-stale.md"
    status: active
    category: process
    area: workflow
    tags: [worktree, subagents, parallel-builders, stale-base, orchestration, git]
    score: 5
    summary: "Worktree subagents fork from the remote default branch unless worktree.baseRef is \"head\"; uncommitted files are always invisible"
  - file: "LESSON-walkthroughs-in-the-humans-words.md"
    status: active
    category: process
    area: workflow
    tags: [walkthroughs, human-decision, plain-language, jargon, approval, specs, vision, human-voice, synthesis, paraphrase]
    score: 5
    summary: "Jargon in walkthroughs and paraphrase in specs both erase the human's own words where they must recognize themselves"
  - file: "LESSON-hierarchical-placement-tolerate-disagreement.md"
    status: active
    category: domain
    area: methodology
    tags: [taxonomy, classification, hierarchical-placement, literature-import, confidence-threshold]
    score: 5
    summary: "Inter-indexer agreement is inherently low; stop at a correct coarse ancestor rather than force a wrong specific leaf"
  - file: "LESSON-template-shape-vs-template-precondition.md"
    status: active
    category: process
    area: methodology
    tags: [templates, folder-spec, taxonomy, spec-writing]
    score: 5
    summary: "A folder-spec template built for 'problem + decisions' doesn't fit a folder that only groups topically related docs"
  - file: "LESSON-obsidian-bare-link-creates-stray-note.md"
    status: active
    category: domain
    area: methodology
    tags: [obsidian, wikilinks, folder-spec, born-folder, click-through]
    score: 5
    summary: "Obsidian does not resolve a bare folder-spec wikilink to its index.md; click-through creates a zero-byte stray note"
  - file: "LESSON-windows-heredoc-backslash-escapes.md"
    status: active
    category: process
    area: workflow
    tags: [windows, git-bash, heredoc, escaping, scratchpad]
    score: 5
    summary: "Git Bash heredocs on Windows collapse backslash escapes; scratchpad script files carry code patches instead"
  - file: "LESSON-scope-notes-are-load-bearing.md"
    status: active
    category: domain
    area: methodology
    tags: [taxonomy, scope-notes, class-here, probe, useless-tokens]
    score: 5
    summary: "A missing Class-here scope line cost a probe 16,900 useless tokens; repair cut it to 2,971"
  - file: "LESSON-deterministic-fixtures-survive-scratch-wipes.md"
    status: archived
    category: process
    area: methodology
    tags: [experiments, scratchpad, determinism, fixtures]
    score: 5
    summary: "Build experiment fixtures deterministically so a wiped scratchpad can be rebuilt identically mid-session"
  - file: "LESSON-self-update-corrections-lag-one-version.md"
    status: active
    category: process
    area: architecture
    tags: [self-update, cli, versioning, migration, bootstrap]
    score: 5
    summary: "Self-update correction logic shipped in version N runs under the N-1 updater; it first fires on the following update"
  - file: "LESSON-threshold-in-prose-becomes-the-criterion.md"
    status: active
    category: process
    area: methodology
    tags: [goodhart, thresholds, agent-instructions, trigger-vs-criterion]
    score: 5
    summary: "A numeric threshold named in prose becomes the criterion agents optimize toward, not just the trigger it names"
  - file: "LESSON-sweep-misses-config-in-skill-prose.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, config-duplication, code-sweep, skill-templates]
    score: 6
    summary: "A code sweep for a duplicated config value misses copies embedded in skill prose or templates"
  - file: "LESSON-vendored-test-suite-must-be-layout-aware.md"
    status: active
    category: process
    area: test-quality
    tags: [testing, vendored-install, layout, path-assumptions, host-install]
    score: 5
    summary: "A vendored test suite must be layout-aware"
  - file: "LESSON-next-num-scope-doubles-type-dir.md"
    status: active
    category: process
    area: methodology
    tags: [cli, next-num, numbering, domain-folders, scope]
    score: 6
    summary: "compass next-num <type> <domain/path> builds type_dir/scope; a scope that already includes the type dir doubles it and silently answers 001"
  - file: "LESSON-teammate-spawn-omit-name.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, orchestration, teammate, agent-tool, spawn]
    score: 5
    summary: "A teammate's Agent-tool call with `name` set fails outright; the roster is flat, so spawn plain subagents by omitting `name`"
  - file: "LESSON-parallel-research-check-siblings-first.md"
    status: active
    category: process
    area: methodology
    tags: [research, parallel-agents, deduplication, vault-writes, methodology]
    score: 5
    summary: "Research agents fanned out onto one spec should read sibling docs in the target domain folder first, and scope around what a sibling already owns"
  - file: "LESSON-verify-wiring-by-call-site-grep.md"
    status: active
    category: process
    area: methodology
    tags: [code-reading, verification, call-sites, confidence, research]
    score: 5
    summary: "A confident claim that a predicate or flag is wired up can be wrong from reading only its defining module; grep every call site first"
  - file: "LESSON-verify-exactness-past-a-compressing-layer.md"
    status: active
    category: process
    area: methodology
    tags: [verification, headroom, compression, bash-output, exactness]
    score: 6
    summary: "Headroom-compressed Bash output can drop words; verify exact text via Read or grep before judging it"
  - file: "LESSON-self-update-silent-on-bad-repository-url.md"
    status: active
    category: process
    area: architecture
    tags: [self-update, doctor, repository, offline, silent-failure]
    score: 5
    summary: "A bad repository URL in plugin.yaml makes self-update look permanently offline; doctor should verify it resolves"
  - file: "LESSON-stated-definitions-are-not-research-axes.md"
    status: active
    category: process
    area: methodology
    tags: [research, axes, human-words, definitions]
    score: 5
    summary: "A definition the human stated in the request is settled; turning it into a research axis re-asks what they already said"
  - file: "LESSON-manual-verification-is-judgment-only.md"
    status: active
    category: process
    area: methodology
    tags: [plans, verification, planner, manual-verification]
    score: 5
    summary: "Plan manual verification holds only judgment calls; mechanical checks go in automated verification or the orchestrator's own check"
  - file: "LESSON-subscription-cost-is-an-estimate-not-a-budget.md"
    status: active
    category: domain
    area: architecture
    tags: [loops, budget, cost, subscription, flow-control]
    score: 5
    summary: "On a Claude Code subscription total_cost_usd is an estimate, not a charge; loop flow control needs plan usage or rate-limit measures, not USD budgets"
  - file: "LESSON-ui-change-needs-agreed-mockup-before-build.md"
    status: active
    category: process
    area: workflow
    tags: [ui, mockup, plan-approval, human-gate]
    score: 5
    summary: "A UI change gets a mockup the human agrees on before any builder runs; a UI built without one gets the plan declined."
  - file: "LESSON-agents-never-stash-the-shared-tree.md"
    status: active
    category: process
    area: workflow
    tags: [git, stash, subagents, tester, uncommitted-work]
    score: 5
    summary: "A subagent that runs git stash in a shared checkout reverts the human's uncommitted files; brief agents to never stash, reset or checkout there"
  - file: "LESSON-test-delimited-blocks-with-the-delimiter-quoted.md"
    status: active
    category: process
    area: testing
    tags: [testing, delimiters, markers, adversarial, block-rewrite]
    score: 5
    summary: "Code that rewrites a span between marker lines must be tested with content quoting the marker; first-occurrence find cuts or duplicates text"
  - file: "LESSON-load-deferred-ask-tool-before-asking.md"
    status: active
    category: process
    area: workflow
    tags: [askuserquestion, toolsearch, deferred-tools, claude-code, gates]
    score: 5
    summary: "AskUserQuestion can be a deferred tool in Claude Code; load it with ToolSearch before a gate question or the question silently degrades to plain text"
  - file: "LESSON-plugin-dir-plus-setup-double-registers-hooks.md"
    status: active
    category: domain
    area: devops
    tags: [hooks, plugin-dir, setup, double-registration, install-drift]
    score: 5
    summary: "--plugin-dir plus /compass:setup in one session registers each hook twice and lists skills twice; capture-check and sync run twice per event"
  - file: "LESSON-research-briefs-forbid-local-paths.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, briefs, researcher, privacy, vault]
    score: 5
    summary: "Researchers copy home paths, session ids and work project names into vault files; brief them to write none of these"
  - file: "LESSON-researcher-briefs-demand-early-output-file.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, briefs, researcher, turn-limits, output-file]
    score: 5
    summary: "Researchers on broad web axes exhaust their 30-turn limit before writing; briefs must say to write the output file early and append per finding"
  - file: "LESSON-parallel-builders-share-one-git-index.md"
    status: active
    category: process
    area: workflow
    tags: [git, parallel-builders, worktree, staging, commit]
    score: 6
    summary: "Builders sharing one worktree share one index; a sibling's commit takes your staged files under its message"
  - file: "LESSON-orchestrating-briefs-require-foreground-spawns.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, orchestration, background, foreground, stall]
    score: 5
    summary: "A lead agent that spawns background children ends its turn 'waiting' with no live children and stalls; briefs must require foreground spawns"
  - file: "LESSON-hook-guards-on-cli-command-it-calls.md"
    status: active
    category: process
    area: devops
    tags: [hooks, cli, install-drift, versioning, plugin-update]
    score: 5
    summary: "Hooks ship with the plugin install but each project's .claude/cli updates separately; a hook calling a new CLI command must skip when the local CLI lacks it"
