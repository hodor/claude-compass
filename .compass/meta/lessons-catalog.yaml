    status: active
    category: process
    area: workflow
    tags: [hooks, if-clause, permission-rules, plugin-config]
    score: 5
    summary: "Hook `if` does not support `||`; split into N entries or use matcher for multi-tool"
  - file: "LESSON-hook-type-prompt-no-skills.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, hook-type, skills, plugin-config]
    score: 5
    summary: "Hook `type: prompt` is single-shot; cannot call Skill tool; use `type: agent` instead"
  - file: "LESSON-no-agent-bookkeeping.md"
    status: active
    category: process
    area: methodology
    tags: [token-efficiency, automation, hooks, skill-design, jit]
    score: 5
    summary: "Mechanical bookkeeping (counters, indexes, catalogs) belongs in scripts/hooks/JIT, not agent steps"
  - file: "LESSON-wikilink-validator-skip-code.md"
    status: active
    category: process
    area: workflow
    tags: [validation, wikilinks, false-positives, content-aware]
    score: 5
    summary: "Wikilink validators must skip fenced code blocks AND inline code spans; example refs in docs are noise"
  - file: "LESSON-test-driven-tasks-dont-discriminate.md"
    status: active
    category: process
    area: workflow
    tags: [benchmarks, evaluation, bench-design, frontier-models, methodology-eval]
    score: 5
    summary: "When tests fully encode the spec, frontier models already read-tests-first; methodology can't be measured on such tasks"
  - file: "LESSON-windows-crlf-breaks-linux-container-scripts.md"
    status: active
    category: process
    area: workflow
    tags: [windows, crlf, docker, line-endings, cross-platform]
    score: 5
    summary: "Python `open(p, 'w')` on Windows writes CRLF; mount that into a Linux container and bash chokes on $'\\\\r'"
  - file: "LESSON-tag-index-trades-cost-for-directed-retrieval.md"
    status: active
    category: process
    area: methodology
    tags: [tag-index, retrieval, cost, hypothesis-falsified, empirical]
    score: 5
    summary: "Tag index makes agents more thorough and faster wall-time, but does not automatically reduce tokens; the cost win depends on the query shape"
  - file: "LESSON-autocrlf-churns-lf-writers.md"
    status: active
    category: process
    area: workflow
    tags: [git, autocrlf, line-endings, gitattributes, churn, hooks]
    score: 5
    summary: "With core.autocrlf=true and no .gitattributes, git checks files out as CRLF; a tool that writes LF rewrites them every run, causing perpetual diffs"
  - file: "LESSON-hook-cli-gate-stdin-on-flag.md"
    status: active
    category: process
    area: workflow
    tags: [cli, hooks, stdin, argparse, non-interactive, hang]
    score: 5
    summary: "Gate hook-stdin reads behind an explicit flag (--hook), not isatty probing; probing blocks forever in a non-interactive shell with no piped input"
  - file: "LESSON-type-dir-discovery-needs-content-signal.md"
    status: active
    category: process
    area: methodology
    tags: [cli, vault, discovery, overfit, false-positives, validation]
    score: 5
    summary: "Treating every .compass subdir as an artifact type dir breaks on vaults that store non-artifact dirs there; require the known core dirs OR a typed-artifact signal"
