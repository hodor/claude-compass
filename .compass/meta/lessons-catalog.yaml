lessons:
  - file: "LESSON-glob-hidden-dirs-prefix.md"
    status: active
    category: process
    area: workflow
    tags: [glob, hidden-dirs, vault-traversal, tool-quirks]
    score: 5
    summary: "Glob tool needs `**/` prefix to traverse hidden dirs like .compass/"
  - file: "LESSON-hook-if-clause-no-or.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, if-clause, permission-rules, plugin-config]
    score: 5
    summary: "Settings hook entries have no `if` clause; select tools via matcher, filter paths in the command"
  - file: "LESSON-hook-type-prompt-no-skills.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, hook-type, skills, plugin-config]
    score: 5
    summary: "Hook `type: prompt` is single-shot; cannot call Skill tool; use `type: agent` instead"
  - file: "LESSON-no-agent-bookkeeping.md"
    status: active
    category: process
    area: methodology
    tags: [token-efficiency, automation, hooks, skill-design, jit]
    score: 5
    summary: "Mechanical bookkeeping (counters, indexes, catalogs) belongs in scripts/hooks/JIT, not agent steps"
  - file: "LESSON-wikilink-validator-skip-code.md"
    status: active
    category: process
    area: workflow
    tags: [validation, wikilinks, false-positives, content-aware]
    score: 5
    summary: "Wikilink validators must skip fenced code blocks AND inline code spans; example refs in docs are noise"
  - file: "LESSON-test-driven-tasks-dont-discriminate.md"
    status: active
    category: process
    area: workflow
    tags: [benchmarks, evaluation, bench-design, frontier-models, methodology-eval]
    score: 5
    summary: "When tests fully encode the spec, frontier models already read-tests-first; methodology can't be measured on such tasks"
  - file: "LESSON-windows-crlf-breaks-linux-container-scripts.md"
    status: active
    category: process
    area: workflow
    tags: [windows, crlf, docker, line-endings, cross-platform]
    score: 5
    summary: "Python `open(p, 'w')` on Windows writes CRLF; mount that into a Linux container and bash chokes on $'\\\\r'"
  - file: "LESSON-tag-index-trades-cost-for-directed-retrieval.md"
    status: active
    category: process
    area: methodology
    tags: [tag-index, retrieval, cost, hypothesis-falsified, empirical]
    score: 5
    summary: "Tag index makes agents more thorough and faster wall-time, but does not automatically reduce tokens; the cost win depends on the query shape"
  - file: "LESSON-autocrlf-churns-lf-writers.md"
    status: active
    category: process
    area: workflow
    tags: [git, autocrlf, line-endings, gitattributes, churn, hooks]
    score: 5
    summary: "With core.autocrlf=true and no .gitattributes, git checks files out as CRLF; a tool that writes LF rewrites them every run, causing perpetual diffs"
  - file: "LESSON-hook-cli-gate-stdin-on-flag.md"
    status: active
    category: process
    area: workflow
    tags: [cli, hooks, stdin, argparse, non-interactive, hang]
    score: 5
    summary: "Gate hook-stdin reads behind an explicit flag (--hook), not isatty probing; probing blocks forever in a non-interactive shell with no piped input"
  - file: "LESSON-type-dir-discovery-needs-content-signal.md"
    status: active
    category: process
    area: methodology
    tags: [cli, vault, discovery, overfit, false-positives, validation]
    score: 5
    summary: "Treating every .compass subdir as an artifact type dir breaks on vaults that store non-artifact dirs there; require the known core dirs OR a typed-artifact signal"
  - file: "LESSON-installer-removes-only-what-it-installed.md"
    status: active
    category: process
    area: methodology
    tags: [install, update, cleanup, data-loss, user-files]
    score: 5
    summary: "A tool that installs into a shared dir must delete only its own named artifacts on cleanup; 'remove anything not in my source' destroys user files"
  - file: "LESSON-long-agents-stall-resume-them.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, orchestration, stall, resume, turn-limits, monitoring]
    score: 5
    summary: "A subagent completion notice whose final text reads like mid-task narration is a stall, not a result; resume it with 'continue from exactly where you stopped' instead of respawning"
  - file: "LESSON-subagent-worktrees-fork-stale.md"
    status: active
    category: process
    area: workflow
    tags: [worktree, subagents, parallel-builders, stale-base, orchestration, git]
    score: 5
    summary: "Worktree-isolated subagents fork from a pre-session commit; without a fast-forward to master and committed prior waves, they see a world where earlier work does not exist"
  - file: "LESSON-hooks-load-only-from-settings.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, settings, install-drift, registration, claude-code]
    score: 5
    summary: "Hooks load only from settings-file hooks keys or registered plugins; a bare .claude/hooks/hooks.json never fires"
  - file: "LESSON-subagent-reports-need-sendmessage.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, orchestration, sendmessage, reports, briefs]
    score: 5
    summary: "A spawned agent's final plain text is invisible to its orchestrator; briefs must mandate an explicit SendMessage delivery"
  - file: "LESSON-append-only-index-misses-mutations.md"
    status: active
    category: process
    area: methodology
    tags: [derived-index, sync, append-only, staleness, catalog]
    score: 5
    summary: "Append-only derived indexes miss source mutations; the mutator must update the row or the field never propagates"
  - file: "LESSON-scratch-vaults-need-compass-dir.md"
    status: active
    category: process
    area: workflow
    tags: [cli, vault-root, isolation, probes, hooks, env-var]
    score: 5
    summary: "CLAUDE_PROJECT_DIR redirects the compass CLI only when it contains .compass; otherwise cwd-walk silently targets the enclosing vault"
  - file: "LESSON-hook-payloads-observe-before-coding.md"
    status: active
    category: process
    area: workflow
    tags: [hooks, payloads, instrumentation, integration, evidence]
    score: 5
    summary: "Capture one real event payload (tee to a file) before keying logic on its fields; assumed shapes ship dead code"
  - file: "LESSON-adversarial-plan-review-before-build.md"
    status: active
    category: process
    area: methodology
    tags: [review, plans, specs, adversarial, multi-lens, measurement]
    score: 5
    summary: "Review specs/plans with 3 adversarial lenses before approval, and have reviewers measure against the real corpus, not opine"
  - file: "LESSON-pin-the-motivating-datum.md"
    status: active
    category: process
    area: methodology
    tags: [specs, evidence, provenance, census, traceability]
    score: 5
    summary: "When a spec cites a triggering observation, record its source (project, session, machine) at spec time; unpinned data become unfindable"
  - file: "LESSON-dont-strip-agent-quality-stations.md"
    status: active
    category: process
    area: workflow
    tags: [subagents, briefs, code-review, agent-protocol, orchestration]
    score: 5
    summary: "A blanket no-sub-agents ban in a spawn brief strips the builder's review station; twice violated, both violations caught real bugs"
  - file: "LESSON-blind-the-author-in-self-validation.md"
    status: active
    category: process
    area: methodology
    tags: [experiments, blinding, validation, measurement, empirical]
    score: 5
    summary: "One agent that both replays the seeded defects and authors the arm under test measures itself, not the mechanism"
  - file: "LESSON-suite-size-is-not-coverage.md"
    status: active
    category: process
    area: testing
    tags: [testing, test-review, coverage, suite-size, empirical]
    score: 5
    summary: "44 tests for two behaviors carried mass redundancy and two critical holes at once; a delete list is half a review"
