# Curated research-source catalog (SPEC-023-research-covers-the-whole-spec
# D-03, D-09). Read by `sourceslib.parse_sources`, a hand-rolled parser: two
# sections at zero indent, `sources` and `do_not_try`, each holding
# `  - name: "..."` rows with `    key: value` fields indented under them.
# Every field's coverage, access mechanics, key requirement and tested
# result comes from research/pipeline/RESEARCH-source-inventory.md, whose
# live-reachability section tested each entry from the deployment machine
# on 2026-09-13.

sources:
  - name: "Crossref"
    coverage: "DOI-registration metadata for journal articles, books, conference proceedings, datasets, dissertations, grants, preprints, reports and standards"
    access: "REST, JSON, no auth; an optional mailto param joins the polite pool for higher, prioritized limits"
    key_requirement: ""
    reachable: "script"
    check_request: "GET https://api.crossref.org/works?query.bibliographic=test&mailto=... -> 200, JSON, over a million results (tested 2026-09-13)"
    retriever: "fetch_crossref"
  - name: "OpenAlex"
    coverage: "open metadata graph of scholarly works, CC0-licensed, successor to Microsoft Academic Graph"
    access: "REST, JSON, keyless calls allowed but credit-metered per call"
    key_requirement: ""
    reachable: "script"
    check_request: "GET https://api.openalex.org/works?per-page=1 -> 200, JSON, response carries a cost_usd field confirming metering runs even keyless (tested 2026-09-13)"
    retriever: "fetch_openalex"
  - name: "Unpaywall"
    coverage: "open-access location layer over Crossref DOIs, returning direct OA PDF links"
    access: "REST, JSON, auth is only an email query parameter, no key"
    key_requirement: ""
    reachable: "script"
    check_request: "GET https://api.unpaywall.org/v2/{doi}?email=... -> 200, JSON OA-location record (tested 2026-09-13)"
    retriever: "fetch_unpaywall"
  - name: "arXiv"
    coverage: "preprint metadata and full text across physics, math, computer science and related fields"
    access: "REST, Atom XML, no auth"
    key_requirement: ""
    reachable: "script"
    check_request: "GET http://export.arxiv.org/api/query?search_query=all:test&max_results=1 -> 200, Atom XML"
    retriever: "fetch_arxiv"
  - name: "OpenReview v2"
    coverage: "ML conference peer-review notes: submissions, reviews and rebuttals for venues including ICLR, NeurIPS and TMLR"
    access: "REST, JSON, the v2 host; public conference data reads without a token"
    key_requirement: ""
    reachable: "script"
    check_request: "GET https://api2.openreview.net/notes/search?term=test&limit=1 -> 200, JSON with a result count; the legacy v1 host at api.openreview.net answers 403 (tested 2026-09-13)"
    retriever: "fetch_openreview_v2"
  - name: "GitHub"
    coverage: "public repository metadata and full source, reachable at zero API-quota cost via git clone"
    access: "git clone and general REST work with no auth; code search and GraphQL require a token"
    key_requirement: ""
    reachable: "script"
    check_request: "GET https://api.github.com/search/repositories?q=test&per_page=1 -> 200, JSON; unauthenticated code search at /search/code instead returns 401 (tested 2026-09-13)"
    retriever: "fetch_github"
  - name: "Semantic Scholar"
    coverage: "paper metadata, abstracts and citation graph across all fields"
    access: "REST, JSON, keyless calls work but are throttled"
    key_requirement: "free key raises the rate limit above 1 req/sec"
    reachable: "script"
    check_request: "GET https://api.semanticscholar.org/graph/v1/paper/search?query=test&limit=1 -> 200 on a first anonymous call, 429 asking for a key on the next (tested 2026-09-13)"
    retriever: "fetch_semantic_scholar"
  - name: "ACM Digital Library"
    coverage: "ACM proceedings and journals, fully open access since 2026-01-01"
    access: "web only; every acm.org subdomain returns a Cloudflare bot challenge to non-browser requests regardless of open-access status"
    key_requirement: ""
    reachable: "browser"
    check_request: "GET https://dl.acm.org/doi/{doi} -> 403 Cloudflare challenge to curl with any user agent; a real browser session passes the wall without logging in (tested 2026-09-13)"
    retriever: "fetch_acm_digital_library"
  - name: "DBLP"
    coverage: "computer-science-only bibliography, metadata only, CC0-licensed"
    access: "REST, JSON, no key; scripted calls receive a bot-challenge page instead of data"
    key_requirement: ""
    reachable: "browser"
    check_request: "GET https://dblp.org/search/publ/api?q=test&format=json -> 200, text/html bot-challenge page, not JSON (tested 2026-09-13)"
    retriever: "fetch_dblp"
  - name: "Internet Archive Scholar"
    coverage: "large full-text scholarly search aggregating Crossref, PubMed, arXiv, JSTOR, ORCID, DOAJ, CORE, Unpaywall, Semantic Scholar and CiteSeerX"
    access: "web search UI, no key; scripted calls receive a session-verification challenge page instead of results"
    key_requirement: ""
    reachable: "browser"
    check_request: "GET https://scholar.archive.org/search?q=test&format=json -> 200, text/html Session Verification challenge page (tested 2026-09-13)"
    retriever: "fetch_internet_archive_scholar"
do_not_try:
  - name: "CiteSeerX"
    coverage: "CS literature metadata and cached PDFs"
    reason: "the oai2 endpoint 301s to a December 2025 Wayback Machine snapshot, which then 404s (tested 2026-09-13)"
  - name: "Papers with Code"
    coverage: "ML paper-to-code links and benchmark leaderboards"
    reason: "site and API were sunset 2025-07-24 and now redirect to Hugging Face Trending Papers; no live API surface remains (tested 2026-09-13)"
  - name: "Fatcat"
    coverage: "open catalog that historically backed Internet Archive Scholar's full-text index"
    reason: "api.fatcat.wiki never completes a TCP handshake, timing out with status 000 after 21 seconds even though DNS resolves (tested 2026-09-13)"
  - name: "OpenReview v1"
    coverage: "legacy OpenReview API host, superseded by the v2 host"
    reason: "api.openreview.net returns 403 on the same query the v2 host answers with 200 JSON (tested 2026-09-13)"
